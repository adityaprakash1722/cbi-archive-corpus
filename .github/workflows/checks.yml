name: checks

# The classifier suite is cheap and guards the one rule this corpus depends on:
# never file a firm's lobbying submission as a regulatory finding. It runs on
# every push.
#
# The rebuild test downloads about 48 MB from Hugging Face and takes several minutes,
# so it runs on a schedule and on demand rather than on every commit. It is the
# only thing that proves the published data is actually sufficient to rebuild
# the index, which was claimed for a while before it was true.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  classifier:
    name: classifier regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the suite
        run: python outputs/cbi-research/scripts/test_classify_provenance.py
        working-directory: ${{ github.workspace }}

  office-extraction:
    name: pinned raw DOCX extraction fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run synthetic body-order unit fixtures
        run: python outputs/cbi-research/scripts/test_convert_office.py
      - name: Re-extract the three adversarial pinned sources
        run: python outputs/cbi-research/scripts/test_raw_source_extraction.py

  crawler:
    name: crawler regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the crawler tests
        run: npm test
        working-directory: outputs/cbi-archive

  compile:
    name: every script parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Byte-compile the pipeline
        run: |
          python -m compileall -q outputs/cbi-research/scripts publish
          echo "all scripts compile"

  manifest-invariants:
    name: manifest invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tracked data agrees with itself and the documents
        run: python outputs/cbi-research/scripts/check_manifest_invariants.py

  fresh-rebuild:
    # Compares every published document and page column available in the pinned
    # release, plus extraction_engine_version and source_file against the
    # materialised manifests. Page text and page-level voice are included.
    #
    # It deliberately does NOT check markdown_sha256: that records the original
    # conversion's hash, and materialised Markdown is not byte-identical to it,
    # so the column can never match here. The manifest-invariants job checks it
    # against the local corpus and index instead, and skips when they are absent.
    name: fresh clone can rebuild the index
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install what the rebuild needs
        run: pip install --quiet duckdb
      - name: Materialise from the published data and index it
        run: python outputs/cbi-research/scripts/test_fresh_rebuild.py

  published-release:
    name: verify every pinned public artifact and raw path
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [classifier, office-extraction, crawler, compile, manifest-invariants, fresh-rebuild]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install verifier dependency
        run: pip install --quiet duckdb
      - name: Verify locked Hugging Face bytes, queries, and all raw paths
        run: python publish/verify_dataset.py

  release-verification:
    # A tag has already been created when this workflow starts. This is a
    # post-publication verification, not a gate that can prevent the tag.
    name: immutable release verified
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [published-release]
    steps:
      - run: echo "the tagged release and its pinned public artifacts were independently verified"
